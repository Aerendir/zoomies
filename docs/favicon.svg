<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 96 96" width="96" height="96">
<style>
.dark{display:none}
@media (prefers-color-scheme: dark){.light{display:none}.dark{display:inline}}
</style>
<image class="light" width="96" height="96" xlink:href="data:image/png;base64,"/>
<image class="dark" width="96" height="96" xlink:href="data:image/png;base64,"/>
</svg>
