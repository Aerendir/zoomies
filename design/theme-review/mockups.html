<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Zoomies Mission Control concept</title>
<style>
:root{color-scheme:dark;--bg:#090e18;--surface:#111b2b;--inset:#0c1421;--border:#2b3a50;--text:#eef4fc;--muted:#afbed2;--accent:#65d9f2;--button:#65d9f2;--ink:#07131d;--success:#5fe0aa;--warning:#ffc56a;--danger:#ff8797;--purple:#cfafff;font:14px/1.5 Inter,system-ui,sans-serif}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text)}button,input,select{font:inherit}button,a,input,select{outline-offset:4px}button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--accent)}button,select{color:var(--text);background:var(--surface);border:1px solid var(--border);border-radius:7px;padding:9px 13px;cursor:pointer;min-height:40px}button:hover{border-color:var(--accent)}a{color:var(--accent)}.primary{background:var(--button);color:var(--ink);font-weight:650;border-color:transparent}.quiet{background:transparent}.mono,code{font-family:ui-monospace,monospace;font-size:13px}.small{font-size:12px}.muted,small{color:var(--muted)}h1{font-size:28px;line-height:1.2;margin:0 0 8px;font-weight:650;letter-spacing:-.6px}h2{font-size:16px;margin:0}h3{font-size:14px;margin:0}p{margin:8px 0}.review{padding:8px 20px;background:var(--inset);border-bottom:1px solid var(--border);display:flex;align-items:center;gap:12px;flex-wrap:wrap;font-size:12px}.review strong{color:var(--accent)}.review select{padding:4px 8px;min-height:32px}.shell{display:grid;grid-template-columns:216px minmax(0,1fr);min-height:calc(100vh - 51px)}aside{border-right:1px solid var(--border);padding:22px 14px;display:flex;flex-direction:column;background:var(--inset)}.brand{font-size:21px;font-weight:750;padding:0 12px 22px}.brand span{color:var(--accent)}nav button{display:block;width:100%;text-align:left;border:0;background:transparent;color:var(--muted);margin:3px 0}nav button.active{background:var(--surface);color:var(--accent);box-shadow:inset 3px 0 var(--accent)}.group{margin:20px 12px 6px;text-transform:uppercase;font-size:11px;letter-spacing:1px;color:var(--muted)}.navfoot{margin-top:auto;padding-top:30px}.work{min-width:0}.top{min-height:60px;border-bottom:1px solid var(--border);padding:10px 28px;display:flex;gap:12px;align-items:center}.grow{flex:1}.live{color:var(--success)}.warn{color:var(--warning)}.bad{color:var(--danger)}.tag{display:inline-flex;gap:5px;align-items:center;font-size:12px;border:1px solid var(--border);border-radius:5px;padding:3px 7px;white-space:nowrap}.top .tag{border:0}.content{max-width:1320px;padding:28px;margin:auto}.heading{display:flex;justify-content:space-between;align-items:center;gap:16px;margin-bottom:22px}.heading p{color:var(--muted);margin:0}.panel{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:20px;min-width:0}.panelhead{display:flex;align-items:center;gap:12px;justify-content:space-between;margin-bottom:18px}.metrics{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px;margin:16px 0}.value{font-size:30px;line-height:1.2;font-weight:650;font-variant-numeric:tabular-nums;margin:12px 0 6px}.attention{border-left:3px solid var(--warning);padding:12px 16px;display:flex;justify-content:space-between;align-items:center;gap:12px}.two{display:grid;grid-template-columns:1.15fr 1fr;gap:16px;margin:16px 0}.row{padding:16px 0;border-top:1px solid var(--border)}.row:first-child{border-top:0;padding-top:0}.flex{display:flex;align-items:center;gap:10px;flex-wrap:wrap}.end{margin-left:auto}.bar{height:7px;background:var(--inset);border-radius:5px;overflow:hidden;margin:12px 0}.bar span{display:block;height:100%;background:var(--accent)}.heat{display:grid;grid-template-columns:36px repeat(24,minmax(0,1fr));gap:4px}.heat i{height:15px;border-radius:2px;background:#134f49}.heat i.hot{background:#3da98a}.heat i.fail{background:var(--danger);position:relative}.heat i.fail:after{content:'!';position:absolute;inset:0;text-align:center;color:var(--ink);font-size:11px;font-style:normal;font-weight:bold}.heat i.empty{background:var(--inset)}.heat label{font-size:11px;color:var(--muted)}.heatframe{overflow:auto}.heat{min-width:600px}.legend{display:flex;gap:16px;flex-wrap:wrap;margin-top:14px;color:var(--muted);font-size:12px}.tableframe{overflow:auto}table{width:100%;border-collapse:collapse;white-space:nowrap}th{text-align:left;font-size:12px;color:var(--muted);font-weight:500;padding:12px}td{border-top:1px solid var(--border);padding:14px 12px}input{background:var(--inset);border:1px solid var(--border);border-radius:7px;color:var(--text);padding:10px 12px;width:100%;min-height:44px}.tabletools{display:flex;gap:12px;align-items:center;margin-bottom:12px}.tabletools input{max-width:400px}.cards{display:none}.poolcards{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}.spec{display:grid;grid-template-columns:1fr 1fr;gap:14px;padding:14px;background:var(--inset);border-radius:7px;margin:18px 0}.swatches{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin:20px 0}.choice{text-align:left;padding:20px;min-height:160px}.choice[aria-pressed=true]{border:2px solid var(--accent)}.sample{border:1px solid #2b3a50;background:#090e18;padding:12px;margin:15px 0;color:#eef4fc;border-radius:5px}.sample.classic{background:#171719;border-color:#343438}.sample b{display:block;background:#111b2b;padding:10px;margin-top:8px;color:#65d9f2}.setting{display:flex;justify-content:space-between;gap:20px;padding:20px 0;border-bottom:1px solid var(--border)}.step{display:flex;align-items:flex-start;gap:12px;padding:15px 0}.number{border:1px solid var(--border);border-radius:50%;width:28px;height:28px;display:grid;place-items:center;flex-shrink:0;color:var(--accent)}pre{background:var(--inset);padding:16px;overflow:auto;border:1px solid var(--border);border-radius:7px}.overlay{position:fixed;inset:0;background:#0008;z-index:10;display:flex;justify-content:flex-end}.drawer{width:460px;max-width:100%;background:var(--surface);padding:24px;overflow:auto;border-left:1px solid var(--border)}.drawer article{background:var(--inset);border:1px solid var(--border);border-radius:8px;padding:16px;margin:18px 0}.bottom{display:none}.note{font-size:12px;color:var(--muted);margin-top:24px}.toast{position:fixed;bottom:25px;left:50%;transform:translateX(-50%);background:var(--surface);border:1px solid var(--accent);padding:12px 20px;border-radius:8px;z-index:20}.classic-theme{--bg:#101012;--surface:#19191d;--inset:#131316;--border:#393940;--accent:#9abfff;--button:#9abfff}.light{color-scheme:light;--bg:#f4f7fb;--surface:#ffffff;--inset:#eaf0f7;--border:#b9c8da;--text:#122235;--muted:#455d76;--accent:#00657a;--button:#00657a;--ink:#ffffff;--success:#14754d;--warning:#815400;--danger:#b52440;--purple:#7541ae}.light .heat i{background:#b7e9d8}.light .heat i.hot{background:#38997a}
@media(max-width:1180px) and (min-width:769px){.shell{grid-template-columns:176px minmax(0,1fr)}.content{padding:20px}.poolcards{grid-template-columns:1fr 1fr}.metrics{grid-template-columns:1fr 1fr}}
@media(max-width:768px){.review{padding:8px 12px;gap:8px}.shell{display:block}aside{display:none}.top{padding:10px 16px;gap:8px;flex-wrap:wrap}.top .endpoint{display:none}.top button{min-height:44px}.top .search{display:none}.content{padding:20px 16px 94px}.heading{align-items:flex-start;flex-wrap:wrap}h1{font-size:24px}.metrics{grid-template-columns:1fr 1fr;gap:12px}.metrics .panel{padding:14px}.value{font-size:26px}.metrics p{font-size:12px}.two,.poolcards,.swatches{grid-template-columns:1fr}.panel{padding:16px}.panelhead{flex-wrap:wrap}.attention{align-items:flex-start;flex-wrap:wrap}.tableframe{display:none}.cards{display:block}.tabletools{flex-wrap:wrap}.setting{flex-direction:column;gap:10px}.bottom{display:flex;position:fixed;bottom:0;left:0;right:0;z-index:5;background:var(--inset);border-top:1px solid var(--border);padding:7px 4px max(7px,env(safe-area-inset-bottom));justify-content:space-around}.bottom button{font-size:12px;padding:10px 8px;border:0;min-height:44px}.drawer{width:100%;border:0;padding:20px}.overlay{align-items:stretch}.note{margin-top:18px}}
</style>
<div class="review"><strong>DESIGN CONCEPT</strong><span>Illustrative data. No live actions.</span><label>Screen <select id="screen"><option value="overview">Overview</option><option value="pools">Pools</option><option value="jobs">Jobs</option><option value="appearance">Appearance</option><option value="onboarding">First job</option></select></label><button id="mode">Light / dark</button></div>
<div class="shell"><aside><div class="brand"><span>↗</span> Zoomies</div><nav><button data-view="overview">◫ Overview</button><div class="group">Fleet</div><button data-view="pools">▱ Pools</button><button data-view="jobs">▤ Jobs</button><button data-view="jobs">◷ Queue</button><button data-view="jobs">⑂ Workflows</button><div class="group">Infrastructure</div><button data-view="pools">▣ Hosts</button><button data-view="pools">☁ Providers</button><div class="group">GitHub</div><button data-view="onboarding">◇ Connections</button></nav><div class="navfoot"><button data-view="appearance">⚙ Appearance</button><p class="small muted">Self-hosted Git runners<br>Concept review • 14 October 2026</p></div></aside><div class="work"><header class="top"><span class="mono endpoint">production / build-lon</span><span class="tag live">● Live</span><span class="grow"></span><button id="problems" class="warn">△ 2 problems</button><button class="search" onclick="notify('Concept: command palette opens here')">Search ⌘K</button><button onclick="openDrawer('eli')">Ask Eli</button><button onclick="show('appearance')" aria-label="Open appearance settings">⚙</button></header><main class="content" id="main"></main></div></div>
<nav class="bottom" aria-label="Primary"><button data-view="overview">Overview</button><button data-view="pools">Pools</button><button data-view="jobs">Jobs</button><button data-view="appearance">More</button></nav>
<script>
const main=document.querySelector('#main');let current='overview';let style='mission';
const heading=(title,sub,action='')=>`<div class="heading"><div><h1>${title}</h1><p>${sub}</p></div>${action}</div>`;
const panel=(title,body,extra='')=>`<section class="panel"><div class="panelhead"><h2>${title}</h2>${extra}</div>${body}</section>`;
const btn=(text,call,primary=false)=>`<button class="${primary?'primary':''}" onclick="${call}">${text}</button>`;
function pools(){return ['linux-x64','gpu-large','arm64-ephemeral'].map((p,i)=>`<div class="row"><div class="flex"><strong class="mono">zoomies-${p}</strong><span class="tag live">${i===2?'Automatic':'Active'}</span><span class="end small">${[4,1,1][i]} busy / ${[8,2,2][i]} live</span></div><div class="bar"><span style="width:${[50,50,50][i]}%"></span></div><div class="flex small muted"><span>${['Linux · x64','Linux · CUDA','macOS · arm64'][i]}</span><span class="end">${[4,1,1][i]} runners available</span></div></div>`).join('')}
const events=`<div class="row"><span class="tag live">Started</span><p><strong>Runner ready on build-prod-1</strong></p><span class="mono muted small">12 seconds ago · zoo-lx-98aa</span></div><div class="row"><span class="tag">CPU boost</span><p><strong>backend-unit-tests received 7.8 vCPU</strong></p><span class="mono muted small">45 seconds ago · zoomies-linux-x64</span></div><div class="row"><span class="tag live">Completed</span><p><strong>frontend-bundle finished successfully</strong></p><span class="mono muted small">1 minute ago · 165 seconds run time</span></div>`;
function overview(){let heat='';['Mon','Tue','Wed','Thu','Fri','Sat','Sun'].forEach((d,r)=>{heat+=`<label>${d}</label>`;for(let i=0;i<24;i++)heat+=`<i class="${(i+r*3)%29===0?'fail':i>8&&i<19?'hot':i%5===0?'empty':''}" title="Illustrative activity, ${d}, ${i}:00"></i>`});return heading('Fleet overview','Your runners, capacity and work in progress.',btn('View jobs',"show('jobs')",true))+`<section class="panel attention"><span><strong class="warn">2 issues need attention</strong><br><span class="small muted">One job has no matching pool. One host needs a reboot.</span></span>${btn('Review issues',"openDrawer('problems')")}</section><div class="metrics">${[['Queued jobs','2','1 needs a matching pool'],['Running jobs','6','Across 3 pools'],['Live runners','12','6 busy · 6 idle'],['P95 queue wait','5.2s','Last hour · P50 1.8s']].map(x=>`<section class="panel"><span class="muted">${x[0]}</span><div class="value">${x[1]}</div><p class="small muted">${x[2]}</p></section>`).join('')}</div><div class="two">${panel('Pool utilisation',pools(),btn('All pools',"show('pools')"))}${panel('Recent fleet events',events,'<span class="muted small">Live feed</span>')}</div>${panel('Activity history',`<div class="heatframe"><div class="heat">${heat}</div></div><div class="legend"><span>Low → high job volume</span><span class="bad">! Failed job</span><span>Empty cell: no jobs</span></div>`,'<select aria-label="Activity range"><option>Last 7 days</option><option>Last 30 days</option></select>')}`}
function poolView(){return heading('Runner pools','Define which jobs run here and the capacity they can use.',btn('+ Create pool',"notify('Concept: existing pool wizard opens here')",true))+`<div class="poolcards">${['linux-x64','gpu-large','arm64-ephemeral'].map((p,i)=>`<section class="panel"><div class="flex"><h2 class="mono">zoomies-${p}</h2><span class="tag live">Active</span></div><p class="muted">${['General purpose builds','Model training and inference','Apple Silicon builds'][i]}</p><div class="flex"><span class="tag">${['linux','cuda','darwin'][i]}</span><span class="tag">${['x64','large','arm64'][i]}</span></div><div class="spec"><div><small>Floor / ceiling</small><br><strong>${[2,0,1][i]} / ${[8,4,4][i]} runners</strong></div><div><small>Per runner</small><br><strong>${[4,8,4][i]} vCPU · ${[4,16,4][i]} GB</strong></div><div><small>CPU boost</small><br><span class="mono">${i===1?'Observe only':'Up to 8 vCPU'}</span></div><div><small>Memory loan</small><br><span class="mono">+1.5 GB</span></div></div><p class="small muted">${[4,1,1][i]} busy runners · ${[4,1,1][i]} available</p>${btn('View pool',"notify('Concept: existing pool detail opens here')")}</section>`).join('')}</div><p class="note">Automatic routing remains a scheduling preference, independent of the visual theme.</p>`}
const jobs=[['backend-unit-tests','Running','acme/backend','zoomies-linux-x64','1.8s','252s'],['frontend-bundle','Running','acme/site','zoomies-linux-x64','2.1s','165s'],['model-quantize','Running','acme/analytics','zoomies-gpu-large','6.4s','750s'],['windows-installer','Unmatched','acme/windows-client','No matching pool','14m','Not started']];
function jobView(){return heading('Jobs','Find a job, see what it is waiting for, and inspect its runner.')+panel('All jobs',`<div class="tabletools"><input aria-label="Search jobs" placeholder="Search job or repository…" oninput="filterJobs(this.value)"><select aria-label="Filter status" onchange="notify('Concept: filter state would persist in the URL')"><option>All statuses</option><option>Running</option><option>Queued</option></select></div><div class="tableframe"><table><thead><tr>${['Job','Status','Repository','Pool','Wait','Run',''].map(t=>`<th>${t}</th>`).join('')}</tr></thead><tbody>${jobs.map(j=>`<tr data-job="${j.join(' ').toLowerCase()}"><td class="mono"><strong>${j[0]}</strong></td><td><span class="tag ${j[1]==='Running'?'live':'warn'}">${j[1]}</span></td>${j.slice(2).map(t=>`<td class="mono">${t}</td>`).join('')}<td>${btn('Inspect',"notify('Concept: job detail opens here')")}</td></tr>`).join('')}</tbody></table></div><div class="cards">${jobs.map(j=>`<article class="row" data-job="${j.join(' ').toLowerCase()}"><div class="flex"><strong class="mono">${j[0]}</strong><span class="tag ${j[1]==='Running'?'live':'warn'}">${j[1]}</span></div><p class="muted">${j[2]}</p><p class="mono small">Pool: ${j[3]}</p><p>Wait: ${j[4]} · Run: ${j[5]}</p>${btn('Inspect job',"notify('Concept: job detail opens here')")}</article>`).join('')}</div>`,'<span class="small muted">4 illustrative jobs</span>')}
function appearance(){return heading('Appearance','Choose the visual style for this browser. Your fleet settings stay the same.')+panel('Visual style',`<div class="swatches">${[['classic','Classic','The current Zoomies appearance.'],['mission','Mission Control','Navy surfaces and cool cyan controls.']].map(([id,name,desc])=>`<button class="choice" aria-pressed="${style===id}" onclick="choose('${id}')"><strong>${name}</strong><div class="sample ${id==='classic'?'classic':''}">Fleet overview<b>6 running jobs · 12 runners</b></div><span class="muted">${desc}</span></button>`).join('')}</div><p class="small muted">Selecting a style applies it immediately. You can return to Classic at any time.</p><div class="setting"><div><h3>Colour mode</h3><p class="muted">Keep your existing system, light or dark preference.</p></div><div class="flex">${btn('Light',"setLight(true)")}${btn('Dark',"setLight(false)")}${btn('System',"setLight(matchMedia('(prefers-color-scheme:light)').matches)")}</div></div><div class="setting"><div><h3>Tables on a phone</h3><p class="muted">The mock shows cards. Production preserves every saved Rows / Cards choice.</p></div><span class="tag">Cards preview</span></div><div class="setting"><div><h3>Logo and Zoomies vocabulary</h3><p class="muted">Existing independent controls remain available in production.</p></div></div>${btn('Reset visual style to Classic',"choose('classic')")}`)}
function onboarding(){return heading('Run your first job','Prove that your connected host can run GitHub Actions.')+panel('One step left',`<div class="step"><span class="number">✓</span><div><strong>GitHub connected</strong><p class="muted">acme organisation · repository selected</p></div></div><div class="step"><span class="number">✓</span><div><strong>Host and pool ready</strong><p class="muted">build-prod-1 · zoomies-linux-x64</p></div></div><div class="step"><span class="number">3</span><div><strong>Add and run the test workflow</strong><p class="muted">Copy this file into your repository's default branch. Then run it from GitHub Actions.</p></div></div><div class="flex"><strong class="mono">zoomies-smoke-test.yml</strong><span class="grow"></span>${btn('Copy workflow',"notify('Concept: workflow copied')",true)}</div><pre><code>name: Zoomies smoke test\non: workflow_dispatch\njobs:\n  smoke:\n    runs-on: [self-hosted, linux, x64, zoomies-linux-x64]\n    steps:\n      - run: echo 'Hello from Zoomies'</code></pre><p class="muted">You need permission to add a workflow. Branch protection may require a pull request.</p><div class="flex">${btn('View GitHub instructions',"notify('Concept: selected repository Actions page opens')")}${btn('Preview first-job success',"success()")}</div><p class="note">No automated workflow mutation or dispatch is implied by this mock.</p>`)}
function success(){main.innerHTML=heading('Your first runner is working','Your job ran on a runner started by this fleet.')+panel('First job completed',`<p class="live">✓ Zoomies smoke test completed</p><div class="metrics"><div><small>Queue wait</small><div class="value">1.8s</div></div><div><small>Run time</small><div class="value">5.1s</div></div></div><p class="mono muted">zoomies-linux-x64 · build-prod-1</p>${btn('View fleet overview',"show('overview')",true)} ${btn('Migrate a workflow',"notify('Concept: existing migration preview opens')")}`)}
function show(view){current=view;document.querySelector('#screen').value=view;main.innerHTML=({overview,pools:poolView,jobs:jobView,appearance,onboarding})[view]();document.querySelectorAll('[data-view]').forEach(b=>b.classList.toggle('active',b.dataset.view===view));document.querySelector('h1')?.setAttribute('tabindex','-1');window.scrollTo(0,0)}
function choose(value){style=value;document.body.classList.toggle('classic-theme',value==='classic');show('appearance');notify('Visual style changed for this concept')}
function setLight(value){document.body.classList.toggle('light',value)}
function filterJobs(value){document.querySelectorAll('[data-job]').forEach(r=>r.hidden=!r.dataset.job.includes(value.toLowerCase()))}
function notify(text){document.querySelector('.toast')?.remove();const t=document.createElement('div');t.className='toast';t.setAttribute('role','status');t.textContent=text;document.body.append(t);setTimeout(()=>t.remove(),2200)}
function openDrawer(kind){const el=document.createElement('div');el.className='overlay';const prior=document.activeElement;el.innerHTML=`<section class="drawer" role="dialog" aria-modal="true" aria-labelledby="drawer-title"><div class="flex"><h2 id="drawer-title">${kind==='eli'?'Eli assistant':'Problems'}</h2><span class="grow"></span>${btn('Close',"closeDrawer()")}</div>${kind==='eli'?`<p class="muted">Context: Fleet overview</p><article><strong>How can I help with this fleet?</strong><p class="muted">Choose a question or describe the problem. This mock does not connect to an AI provider.</p></article><label>Your question<input placeholder="Why is windows-installer waiting?"></label><p>${btn('Send',"notify('Design concept only; no message sent')",true)}</p>`:`<article><span class="tag warn">Job blocked</span><h3 style="margin-top:12px">windows-installer has no matching pool</h3><p class="muted">The job requests windows-2022. None of the connected pools can supply that label.</p><p><strong>Next step:</strong> Review the workflow labels or add compatible capacity.</p>${btn('Review job',"closeDrawer();show('jobs')",true)}</article><article><span class="tag warn">Host maintenance</span><h3 style="margin-top:12px">home-lab-macmini needs a reboot</h3><p class="muted">Drain active work before restarting the host. Zoomies will not restart it from this review.</p>${btn('Review host',"notify('Concept: host detail opens here')")}</article>`}</section>`;document.body.append(el);const dialog=el.querySelector('.drawer');dialog.querySelector('button').focus();el.addEventListener('keydown',e=>{if(e.key==='Escape')closeDrawer();if(e.key==='Tab'){const controls=[...dialog.querySelectorAll('button,input,a,select')];const first=controls[0],last=controls.at(-1);if(e.shiftKey&&document.activeElement===first){e.preventDefault();last.focus()}else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first.focus()}}});el.prior=prior}
function closeDrawer(){const el=document.querySelector('.overlay');if(el){const p=el.prior;el.remove();p?.focus()}}
document.querySelectorAll('[data-view]').forEach(b=>b.onclick=()=>show(b.dataset.view));document.querySelector('#screen').onchange=e=>show(e.target.value);document.querySelector('#mode').onclick=()=>setLight(!document.body.classList.contains('light'));document.querySelector('#problems').onclick=()=>openDrawer('problems');show(new URLSearchParams(location.search).get('view')||'overview');
</script></html>
